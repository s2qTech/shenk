name: Native Android

on:
  push:
    paths:
      - "android-app/**"
      - "contracts/conformance/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "contracts/conformance/**"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify source, tests, lint, and debug APK
        run: ./gradlew package0Check
      - uses: actions/upload-artifact@v4
        with:
          name: shenk-package0-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  instrumentation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run Compose instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          script: cd android-app && ./gradlew connectedDebugAndroidTest
