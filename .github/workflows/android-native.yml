name: Native Android

on:
  push:
    paths:
      - "android-app/**"
      - "contracts/conformance/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "contracts/conformance/**"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify native Android repository boundaries
        run: node --test ../tests/android-package0.test.js ../tests/android-package8-release.test.js
      - name: Verify source, tests, lint, debug APK, and unsigned release APK
        shell: bash
        run: |
          set +e
          ./gradlew package8FoundationCheck 2>&1 | tee package8-foundation-check.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            {
              echo "### Native Android verification failed"
              echo
              echo '```text'
              tail -n 160 package8-foundation-check.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failure_tail=$(tail -n 80 package8-foundation-check.log)
            failure_tail=${failure_tail//'%'/'%25'}
            failure_tail=${failure_tail//$'\r'/'%0D'}
            failure_tail=${failure_tail//$'\n'/'%0A'}
            echo "::error title=Native Android verification failed::$failure_tail"
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: shenk-native-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  instrumentation:
    needs: verify
    runs-on: ubuntu-latest
    # The emulator action installs and cold-boots its system image before the
    # test script starts. Keep the job allowance separate from the test limit.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build instrumentation APKs before emulator boot
        run: >-
          ./gradlew --no-parallel
          :core:data-sync:assembleDebug
          :core:data-sync:assembleDebugAndroidTest
          :app:assembleDebug
          :app:assembleDebugAndroidTest
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android-app
          script: ./ci/run-instrumentation.sh
